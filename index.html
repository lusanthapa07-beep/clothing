<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clothing Collection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }
        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }
        h1 {
            margin: 0;
        }
        .container {
            padding: 20px;
            text-align: center;
        }
        .item {
            display: inline-block;
            margin: 15px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .item img {
            width: 200px;
            height: 250px;
            border-radius: 10px;
        }
        .item h3 {
            margin: 10px 0 5px;
        }
        .item p {
            color: green;
            font-weight: bold;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Trendy Clothing Collection</h1>
    <p>Stylish & Affordable Fashion</p>
</header>

<div class="container">

    <div class="item">
        <img src="https://via.placeholder.com/200x250?text=Kurtha+1" alt="Kurtha">
        <h3>Stylish Kurtha</h3>
        <p>Rs. 1200</p>
    </div>

    <div class="item">
        <img src="https://via.placeholder.com/200x250?text=Kurtha+2" alt="Kurtha">
        <h3>Casual Kurtha</h3>
        <p>Rs. 1000</p>
    </div>

    <div class="item">
        <img src="https://via.placeholder.com/200x250?text=Dress+1" alt="Dress">
        <h3>Modern Dress</h3>
        <p>Rs. 1500</p>
    </div>

    <div class="item">
        <img src="https://via.placeholder.com/200x250?text=Shirt+1" alt="Shirt">
        <h3>Fashion Shirt</h3>
        <p>Rs. 900</p>
    </div>

</div>

<footer>
    <p>Contact: 9861915524</p>
    <p>Owner: Salina & Lusan</p>
</footer>

</body>
</html>
